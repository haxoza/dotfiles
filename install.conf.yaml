- defaults:
    link:
      relink: true

- clean: ['~']

- create:
    ~/.ssh:
        mode: 0700

- shell:
    - command: make -C codex merge
      description: Merge Codex settings into ~/.codex/config.toml
      stderr: true
    - command: ./claude/sync-settings.sh merge
      description: Merge Claude settings into ~/.claude/settings.json
      stderr: true

- link:
    ~/.config/zed/keymap.json:
        create: true
        backup: true
        path: zed/keymap.symlink.json
    ~/Library/Application Support/iTerm2/DynamicProfiles/Dotfiles.json:
        create: true
        path: iterm2/Profiles.symlink.json
    ~/.aerospace.toml:
        create: true
        path: aerospace/aerospace.${DOTFILES_MACHINE}.toml
    ~/.condarc: conda/condarc.symlink
    ~/.config/starship.toml:
        create: true
        path: starship/starship.symlink.toml
    ~/.cursor/sandbox.json:
        create: true
        path: cursor/sandbox.symlink.json
    ~/.claude/statusline-command.sh:
        create: true
        path: claude/statusline-command.sh
    ~/.claude/caffeinate-manage.sh:
        create: true
        path: claude/caffeinate-manage.sh
    ~/.claude/skills:
        create: true
        glob: true
        path: agents/skills/*
    ~/.agents/skills:
        create: true
        glob: true
        path: agents/skills/*
    ~/.config/opencode/opencode.jsonc:
        create: true
        path: opencode/opencode.jsonc.symlink
    ~/.gitconfig: git/gitconfig.symlink
    ~/.gitconfig.local: git/gitconfig.local.symlink
    ~/.gitignore: git/gitignore.symlink
    ~/.gnupg/gpg.conf: gpg/gpg.symlink.conf
    ~/.gnupg/gpg-agent.conf: gpg/gpg-agent.symlink.conf
    ~/.hgrc: hg/hgrc.symlink
    ~/.hgrc.local: hg/hgrc.local.symlink
    ~/.pypirc: pypi/pypirc.symlink
    ~/.ssh/config:
        create: true
        path: ssh/config.${DOTFILES_MACHINE}
    ~/.ssh/config.local:
        create: true
        path: ssh/config.local
    ~/.config/1Password/ssh/agent.toml:
        create: true
        backup: true
        path: ssh/agent.${DOTFILES_MACHINE}
    ~/.vimrc: vim/vimrc.symlink
    ~/.zshenv: zsh/zshenv.symlink
    ~/.zshrc: zsh/zshrc.symlink
    ~/.zprofile: zsh/zprofile.symlink
