# Secure-by-default Codex baseline.
#
# This baseline is tracked in git. Machine-specific trust entries belong in
# `trusted.local.toml`, which is intentionally left out of version control.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"

# More autonomous than the default "untrusted", but still safe:
# - routine work can proceed in the sandbox
# - actions that need elevated permissions still require approval
# - eligible low-risk approval prompts are reviewed automatically
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[tui]
# Mirror the Claude Code status line with Codex-native, theme-aware fields.
# Conditional items are omitted when unavailable or inactive.
status_line = [
  "project-name",
  "git-branch",
  "model-with-reasoning",
  "fast-mode",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "estimated-thread-cost",
  "thread-name",
]

[sandbox_workspace_write]
# Codex CLI currently exposes a coarse sandbox network toggle rather than
# Claude-style per-domain allowlists. Enable it so package managers can resolve
# and download dependencies without extra approval prompts.
network_access = true

# Permit a few safe cache/state locations that commonly unblock agentic work on
# macOS without broadening filesystem access.
writable_roots = [
  "~/.local/state/fnm_multishells",
  "~/.npm/_cacache",
  "~/Library/Caches/uv",
]

[desktop]
followUpQueueMode = "queue"
mac-menu-bar-enabled = false
conversationDetailMode = "STEPS_PROSE"
browser-show-full-url = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true
