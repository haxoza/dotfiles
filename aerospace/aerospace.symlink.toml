# AeroSpace uses its own workspaces instead of macOS Spaces.
config-version = 2

start-at-login = true
auto-reload-config = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
persistent-workspaces = ['1', '2', '3', '4', '5']

[workspace-to-monitor-force-assignment]
1 = ['dell', 'main']     # Development: editor and Ghostty
2 = ['dell', 'main']     # Browser and research
3 = ['built-in', 'main'] # Communication: Slack and Signal
4 = ['built-in', 'main'] # Planning and misc: Sunsama, Obsidian, and Spotify
5 = ['dell', 'main']     # Personal

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

ctrl-left = 'list-workspaces --monitor focused | workspace --wrap-around --stdin prev'
ctrl-right = 'list-workspaces --monitor focused | workspace --wrap-around --stdin next'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'

ctrl-alt-shift-1 = 'move-node-to-workspace 1; workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2; workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3; workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4; workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5; workspace 5'

ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'

ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'

ctrl-alt-tab = 'workspace-back-and-forth'
ctrl-alt-semicolon = 'mode service'

[mode.service.binding]
esc = 'mode main'
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
