# AeroSpace uses its own workspaces instead of macOS Spaces.
# Keep shared controls and layout behavior in sync; workspace plans are machine-specific.
config-version = 2

start-at-login = true
auto-reload-config = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
persistent-workspaces = ['1', '2', '3', '4', '5', '6']

# Machine-specific monitor assignments.
[workspace-to-monitor-force-assignment]
1 = 'main' # Development: Orca and Ghostty
2 = 'main' # Code editors: Zed and VS Code
3 = 'main' # Personal: Firefox, ChatGPT and Claude
4 = 'main' # Planning: Sunsama and Obsidian
5 = 'main' # Media: Spotify
6 = 'main' # Work: Chrome and Slack

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

ctrl-left = 'list-workspaces --monitor focused | workspace --wrap-around --stdin prev'
ctrl-right = 'list-workspaces --monitor focused | workspace --wrap-around --stdin next'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'

ctrl-alt-shift-1 = 'move-node-to-workspace 1; workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2; workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3; workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4; workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5; workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6; workspace 6'

ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'

ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'

ctrl-alt-tab = 'workspace-back-and-forth'
ctrl-alt-semicolon = 'mode service'

[mode.service.binding]
esc = 'mode main'
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

# Shared floating-window rules.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Copy|Move|Delete|Info|Connecting'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
if.window-title-regex-substring = 'Huddle'
check-further-callbacks = true
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'layout floating'

# Machine-specific app placement.
# Placement runs when a window is detected. Moving it later by hand is allowed.
# Monitor changes move the assigned workspaces with their windows.
[[on-window-detected]]
if.app-id = 'com.stablyai.orca'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1; layout floating'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.sunsama.native-app'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 5'
